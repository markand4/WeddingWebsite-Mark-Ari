substitutions:
  _REGION: us-central1
  _SERVICE: wedding-website
  _SQL_INSTANCE: ''   # set to PROJECT:REGION:INSTANCE after creating Cloud SQL

steps:
  # Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/wedding/$_SERVICE:$COMMIT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/wedding/$_SERVICE:latest'
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/wedding/$_SERVICE'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE'
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/wedding/$_SERVICE:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=0
      - --max-instances=5
      - --memory=256Mi
      - --cpu=1
      - --set-secrets=DATABASE_URL=wedding-db-url:latest
      - --add-cloudsql-instances=$_SQL_INSTANCE

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/wedding/$_SERVICE:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
